<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Nutri</title>
<meta name="theme-color" content="#0c0e13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutri">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --bg:#0c0e13;--card:#151922;--card2:#1d2230;--line:#272d3d;
  --text:#f1f3f8;--muted:#8a93a8;--accent:#ff8a3d;--accent2:#e86a1c;
  --prot:#60a5fa;--carb:#fbbf24;--fat:#f472b6;--fib:#34d399;
  --good:#34d399;--warn:#fbbf24;--bad:#fb7185;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);color-scheme:dark;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;min-height:100vh}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#view{max-width:560px;margin:0 auto;padding:6px 16px 20px}
h1{font-size:28px;font-weight:750;letter-spacing:-.5px;margin:0}
h2{font-size:19px;font-weight:700;margin:0}
h3{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin:22px 4px 8px}
p{margin:6px 0;line-height:1.45}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0}
.card.tight{padding:12px 14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--card2);font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:#1a0d02}
.btn.block{display:flex;width:100%}
.btn.small{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:active{transform:scale(.97);opacity:.85}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.iconbtn:active{opacity:.7}
input.f,select.f,textarea.f{width:100%;background:var(--card2);border:1px solid transparent;border-radius:12px;padding:11px 12px;outline:none;font-size:16px}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
textarea.f{min-height:150px;resize:vertical;line-height:1.5}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:12px 2px 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card);border-radius:13px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;height:34px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;background:var(--card);color:var(--muted);font-size:13.5px;font-weight:600}
.chip.on{background:var(--accent);color:#1a0d02}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 4px}
.daynav{display:flex;align-items:center;gap:6px}
.daynav .t{font-size:13px;color:var(--muted);font-weight:600}

/* ring */
.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:28px;font-weight:750;letter-spacing:-.5px}
.bars{flex:1;min-width:0}
.bar{margin:7px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar .lab b{font-weight:650}
.track{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:9px;transition:width .4s}
.track.over i{background:var(--bad)!important}
.micro{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.micro .bar{margin:5px 0}
.micro .track{height:6px}

/* meals */
.meal{background:var(--card);border-radius:16px;padding:13px 14px;margin:8px 0}
.meal .hd{display:flex;align-items:center;gap:10px}
.meal .ttl{font-weight:650}
.meal .k{font-weight:700;white-space:nowrap}
.macros{display:flex;gap:10px;font-size:12px;color:var(--muted);margin-top:3px}
.macros b{font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:9px;margin-right:3px;vertical-align:1px}
.items{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.items .it{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0;gap:8px}
.mtype{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 4px 2px;display:flex;justify-content:space-between}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(12,14,19,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600;padding:4px 0}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--accent)}
#tabs .plus{flex:none;width:54px;height:54px;border-radius:18px;background:var(--accent);color:#1a0d02;margin:0 6px;box-shadow:0 6px 20px rgba(255,138,61,.35);justify-content:center}
#tabs .plus svg{width:28px;height:28px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet.closing{animation:down .2s ease-in forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:17px;text-align:center}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(30px + env(safe-area-inset-bottom))}
.sheet .sb>div{max-width:560px;margin:0 auto}
.sheet .sf{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.sheet .sf>div{max-width:560px;margin:0 auto}

/* item rows in add */
.irow{display:grid;grid-template-columns:1fr 62px 92px 42px 22px;gap:6px;align-items:center;background:var(--card);border-radius:14px;padding:9px 10px;margin:6px 0}
.irow.bad{outline:1.5px solid var(--bad)}
.irow.warn{outline:1.5px solid var(--warn)}
.irow .nm{font-size:14px;font-weight:600;line-height:1.2;overflow:hidden}
.irow .nm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow input,.irow select{width:100%;background:var(--card2);border:0;border-radius:9px;padding:7px 6px;font-size:16px;outline:none}
.irow select{font-size:13px;padding:8px 2px}
.irow .kc{text-align:right;font-size:13px;font-weight:650}
.irow .x{color:var(--muted);font-size:18px}
.res{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.res:active{background:var(--card)}
.res .nm{font-weight:600;font-size:14.5px}
.tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.tot div{background:var(--card2);border-radius:12px;padding:8px 2px}
.tot b{display:block;font-size:17px}
.tot span{font-size:11px;color:var(--muted)}

/* plan */
.plan{border:1.5px solid transparent;cursor:pointer}
.plan.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(255,138,61,.09),transparent),var(--card)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border:0}
.kv span:last-child{font-weight:650;text-align:right}
.day{background:var(--card);border-radius:18px;margin:10px 0;overflow:hidden}
.day .dh{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
.rec{padding:10px 14px;border-top:1px solid var(--line)}
.rec .tp{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.4px;text-transform:uppercase}
.rec details summary{list-style:none;cursor:pointer}
.rec details summary::-webkit-details-marker{display:none}
.ing{font-size:13px;color:var(--muted);margin:8px 0 4px;line-height:1.6}
.shop{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.shop .cb{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.shop.done .cb{background:var(--good);border-color:var(--good);color:#04130c}
.shop.done .nm{text-decoration:line-through;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.cal .cd{aspect-ratio:.8;background:var(--card);border-radius:11px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;font-size:12px;position:relative;border:1.5px solid transparent}
.cal .cd.empty{background:transparent}
.cal .cd.today{border-color:var(--accent)}
.cal .cd .n{font-weight:650;font-size:12.5px}
.cal .cd .kc{font-size:10.5px;font-weight:650;margin-top:auto}
.cal .cd .w{font-size:9.5px;color:var(--muted)}
.cal .cd.g{background:rgba(52,211,153,.14)}.cal .cd.g .kc{color:var(--good)}
.cal .cd.a{background:rgba(251,191,36,.13)}.cal .cd.a .kc{color:var(--warn)}
.cal .cd.r{background:rgba(251,113,133,.13)}.cal .cd.r .kc{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}

/* report */
.rep{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rep:last-child{border:0}
.rep .ic{font-size:18px;line-height:1.2}
.rep b{font-weight:650}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.3px}
.stat span{font-size:11.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f1f3f8;color:#0c0e13;padding:10px 16px;border-radius:13px;font-weight:600;font-size:14px;z-index:90;max-width:90%;text-align:center;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translate(-50%,8px)}}
.note{background:rgba(255,138,61,.1);border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.45;margin:10px 0}
.note.blue{background:rgba(96,165,250,.1)}
a{color:var(--accent)}
.src li{margin:6px 0;font-size:13px;color:var(--muted);line-height:1.4}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="sheets"></div>
<script src="foods.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
